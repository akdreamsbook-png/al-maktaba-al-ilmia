<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدروس والمحاضرات — المكتبة العلمية</title>
<meta name="description" content="تصفح الدروس والمحاضرات والخطب مع البحث والتصفية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261018">
</head>
<body>
<header class="topbar"><div class="wrap">
<a class="brand" href="index.html"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg></span><span class="t"><b>المكتبة العلمية</b><small>فضيلة الشيخ أبو أنس محمد مصطفى صار</small></span></a>
<button class="nav-toggle" id="nav-toggle" aria-label="القائمة" aria-expanded="false">☰</button>
<nav class="main" id="main-nav"><a href="index.html">الرئيسية</a><a href="lessons.html" class="active">الدروس</a><a href="series.html">السلاسل العلمية</a><a href="lessons.html?kind=khotba" data-i18n="nav.khotab"></a><a href="lessons.html?kind=general" data-i18n="nav.lectures"></a><a href="books.html">الكتب والملفات</a></nav>
</div></header>
<main class="container">
  <section class="block">
    <h2 style="color:var(--navy)" data-i18n="lessons.title"></h2>
    <div class="filters">
      <input id="q" type="search" data-i18n-ph="lessons.searchPh">
      <select id="f-series"><option value="" data-i18n="filter.allSeries"></option></select>
      <select id="f-cat"><option value="" data-i18n="filter.allCats"></option></select>
      <select id="f-kind">
        <option value="" data-i18n="filter.allKinds"></option>
        <option value="lesson" data-i18n="kind.lesson"></option>
        <option value="khotba" data-i18n="kind.khotba"></option>
        <option value="general" data-i18n="kind.general"></option>
        <option value="book" data-i18n="kind.book"></option>
        <option value="research" data-i18n="kind.research"></option>
        <option value="file" data-i18n="kind.file"></option>
      </select>
    </div>
    <div id="count" style="color:var(--muted);font-size:14px"></div>
    <div class="grid" id="list" style="margin-top:12px"></div>
  </section>
</main>
<footer><div class="copy">المكتبة العلمية لفضيلة الشيخ أبي أنس محمد مصطفى صار</div></footer>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function(){
  const p = new URLSearchParams(location.search);
  const q0 = p.get("q") || "", kind0 = p.get("kind") || "";
  const $ = id => document.getElementById(id);
  $("q").value = q0; $("f-kind").value = kind0;
  const data = await Store.getPublic();
  const sMap = {}; data.series.forEach(s => sMap[s.id] = I18N.ct(s));
  data.series.forEach(s => { const o=document.createElement("option"); o.value=s.id; o.textContent=s.title; $("f-series").appendChild(o); });
  data.categories.forEach(c => { const o=document.createElement("option"); o.value=c.name; o.textContent=c.name; $("f-cat").appendChild(o); });
  const kindLabel = k => (["lesson","lecture","khotba","general","audio","video","book","research","file"].indexOf(k) >= 0 ? t("kind." + k) : t("kind.lesson"));
  function render(){
    const items = Store.filterLessons(data.lessons, { q: $("q").value, seriesId: $("f-series").value, cat: $("f-cat").value, kind: $("f-kind").value });
    $("count").textContent = t("lessons.count") + items.length;
    $("list").innerHTML = items.length ? items.map(l =>
      '<article class="card">' + ((l.images && l.images[0]) ? '<img class="thumb" src="' + Store.esc(l.images[0]) + '" loading="lazy" alt="">' : '')
      + '<h3><a href="'+Store.lessonUrl(l)+'">'+Store.esc(I18N.ct(l))+'</a></h3>'
      + '<div class="meta"><span class="badge">'+Store.esc(kindLabel(l.kind))+'</span>'
      + (l.series_id && sMap[l.series_id] ? '<span>'+Store.esc(sMap[l.series_id])+'</span>' : '')
      + (l.number ? '<span>'+t('word.lesson')+' '+Store.esc(l.number)+'</span>' : '')
      + (l.khatib ? '<span>🕌 '+Store.esc(l.khatib)+'</span>' : '')
      + (l.place ? '<span>'+Store.esc(l.place)+'</span>' : '')
      + (l.hijri_date ? '<span>🗓 '+Store.esc(l.hijri_date)+'</span>' : '')
      + (l.duration ? '<span>⏱ '+Store.esc(l.duration)+'</span>' : '')
      + (l.date ? '<span>'+Store.esc(l.date)+'</span>' : '') + '</div>'
      + '<p>'+Store.esc(I18N.cd(l).slice(0,120))+'</p>'
      + '<div class="row"><a class="btn small" href="'+Store.lessonUrl(l)+'">'+(l.audio_url ? t('btn.listen') : t('btn.viewLesson'))+'</a></div></article>').join("")
      : '<div class="empty-state"><span class="ic">📭</span>' + t('lessons.noResults') + '</div>';
  }
  ["q","f-series","f-cat","f-kind"].forEach(id => $(id).addEventListener("input", render));
  render();
})();
</script>
</body>
</html>
