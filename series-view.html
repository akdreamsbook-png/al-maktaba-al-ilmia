<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلسلة — المكتبة العلمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261018">
</head>
<body>
<header class="topbar"><div class="wrap">
<a class="brand" href="index.html"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg></span><span class="t"><b>المكتبة العلمية</b><small>فضيلة الشيخ أبو أنس محمد مصطفى صار</small></span></a>
<button class="nav-toggle" id="nav-toggle" aria-label="القائمة" aria-expanded="false">☰</button>
<nav class="main" id="main-nav"><a href="index.html">الرئيسية</a><a href="lessons.html">الدروس</a><a href="series.html" class="active">السلاسل العلمية</a><a href="lessons.html?kind=khotba" data-i18n="nav.khotab"></a><a href="lessons.html?kind=general" data-i18n="nav.lectures"></a><a href="books.html">الكتب والملفات</a><a href="ask.html" data-i18n="nav.ask"></a></nav>
</div></header>
<main class="container" id="main"><div class="loading" data-i18n="common.loading"></div></main>
<footer><div class="copy">المكتبة العلمية لفضيلة الشيخ أبي أنس محمد مصطفى صار</div></footer>
<script src="assets/js/i18n.js?v=20261018"></script>
<script src="assets/js/store.js?v=20261018"></script>
<script src="assets/js/nav.js?v=20261018"></script>
<script>
(async function(){
  const id = new URLSearchParams(location.search).get("id");
  const main = document.getElementById("main");
  if (!id) { main.innerHTML = '<div class="error">' + t("series.noId") + '</div>'; return; }
  const data = await Store.getPublic();
  const s = data.series.find(x => x.id === id);
  if (!s) { main.innerHTML = '<div class="empty">' + t("series.notFound") + '</div>'; return; }
  document.title = I18N.ct(s) + " — " + I18N.t("brand");
  const lessons = data.lessons.filter(l => l.series_id === id).sort((a,b)=>(a.sort||a.number||0)-(b.sort||b.number||0));
  main.innerHTML =
    '<section class="block"><h2 style="color:var(--navy)">'+Store.esc(I18N.ct(s))+'</h2>'
    + (I18N.cd(s) ? '<p>'+Store.esc(I18N.cd(s))+'</p>' : '')
    + '<div class="row"><button class="btn small" id="share">' + t("btn.shareSeries") + '</button><button class="btn small ghost" id="copy">' + t("btn.copyLink") + '</button></div>'
    + '<h3 style="color:var(--navy)">' + t("series.lessonsOf") + ' (' + lessons.length + ')</h3>'
    + (lessons.length ? '<div class="grid">' + lessons.map(l =>
      '<article class="card"><h3><a href="'+Store.lessonUrl(l)+'">'+Store.esc(I18N.ct(l))+'</a></h3>'
      + '<div class="meta">'+(l.number?'<span class="badge">' + t("word.lesson") + ' ' + Store.esc(l.number) + '</span>':'')+(l.audio_url?'<span>' + t("badge.audio") + '</span>':'')+(l.pdf_url?'<span>' + t("badge.file") + '</span>':'')+'</div>'
      + '<p>'+Store.esc(I18N.cd(l).slice(0,120))+'</p><a class="btn small" href="'+Store.lessonUrl(l)+'">' + t("btn.viewLesson") + '</a></article>').join("") + '</div>'
      : '<div class="empty">' + t("series.lessonsEmpty") + '</div>')
    + '</section>';
  document.getElementById("share").onclick = async () => {
    const url = location.href;
    if (navigator.share) { try { await navigator.share({ title: I18N.ct(s), url }); } catch(e){} }
    else { await navigator.clipboard.writeText(url); alert(t("msg.copiedSeries")); }
  };
  document.getElementById("copy").onclick = async () => { await navigator.clipboard.writeText(location.href); alert(t("msg.copied")); };
})();
</script>
</body>
</html>
